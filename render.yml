services:
  # 1. The Spring Boot Monolith Application Web Service
  - type: web
    name: entos-cafe-api-dev
    env: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      - key: PORT
        value: 8083

      # This bypasses the embedded user/password string completely!
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://${DB_INTERNAL_HOST}:5432/entos_db_dev
      - key: DB_INTERNAL_HOST
        fromDatabase:
          name: entos-db-dev
          property: host

      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: entos-db-dev
          property: user

      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: entos-db-dev
          property: password

      - key: JWT_SECRET
        sync: false
      - key: OAUTH2_GOOGLE_CLIENT_ID
        sync: false
      - key: OAUTH2_GOOGLE_CLIENT_SECRET
        sync: false

databases:
  # 2. The Private Managed PostgreSQL Instance
  - name: entos-postgres-db-dev
    databaseName: entos_db_dev
    user: entos_admin
    plan: free
    region: singapore