services:
  # 1. The Spring Boot Monolith Application Web Service (DEV Environment)
  - type: web
    name: entos-cafe-api-dev
    env: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    plan: free
    region: singapore
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: dev                        # ⚡ Kept as dev for your DEV server!
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: entos-postgres-db-dev
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: OAUTH2_GOOGLE_CLIENT_ID
        sync: false
      - key: OAUTH2_GOOGLE_CLIENT_SECRET
        sync: false

databases:
  # 2. The Private Managed PostgreSQL Instance (DEV Environment)
  - name: entos-postgres-db-dev
    databaseName: entos_db_dev
    user: entos_admin
    plan: free
    region: singapore

envVars:
  - key: SPRING_PROFILES_ACTIVE
    value: dev

  # ⚡ THE SENIOR DEVOPS FIX: Concatenate the prefix cleanly at the infrastructure layer
  - key: DB_URL
    value: jdbc:${SPRING_DATASOURCE_URL}

  - key: DB_USERNAME
    value: ${SPRING_DATASOURCE_USERNAME}

  - key: DB_PASSWORD
    value: ${SPRING_DATASOURCE_PASSWORD}