spring:
  application:
    name: entos-cafe-platform

  # This is the modern way to activate multiple module files
  config:
    import:
      - "optional:classpath:application-identity.yml"
      - "optional:classpath:application-api.yml"
      - "optional:classpath:application-shared.yml"
      - "optional:classpath:application-infra.yml"
      - "optional:classpath:application-platform.yml"
      - "optional:classpath:application-cafe.yml"

  # Default profile when no profile is explicitly set
  profiles:
    active: dev,identity,infra,api,shared
    include:
      - identity
      - infra
      - api
      - shared
      - cafe
      - platform

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 60000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
    open-in-view: false

server:
  port: 8083

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    com.zaxxer.hikari: DEBUG
    org.hibernate.engine.jdbc.env: DEBUG



