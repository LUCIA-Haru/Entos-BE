server:
  port: 8080
  servlet:
    context-path: /api/


springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs
  # Groups the modules in a dropdown menu in the UI
  group-configs:
    - group: '1-Identity-Module'
      packages-to-scan: com.lr.entos.identity
    - group: '2-Cafe-API-Module'
      packages-to-scan: com.lr.entos.api


management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

